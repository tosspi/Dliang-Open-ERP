<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 大亮ERP</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8fafc;
      min-h-screen;
    }
    
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
    }
    
    .left-panel {
      background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #475569 100%);
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }
    
    .left-panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: radial-gradient(circle at 25% 25%, rgba(255,255,255,0.05) 0%, transparent 50%),
                        radial-gradient(circle at 75% 75%, rgba(255,255,255,0.03) 0%, transparent 50%);
      pointer-events: none;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      color: white;
      font-size: 20px;
      font-weight: 600;
      z-index: 1;
    }
    
    .logo-icon {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    
    .brand-content {
      z-index: 1;
      text-align: center;
      color: white;
    }
    
    .brand-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }
    
    .brand-subtitle {
      font-size: 16px;
      opacity: 0.8;
      line-height: 1.6;
    }
    
    .features {
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 1;
    }
    
    .feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255,255,255,0.9);
      font-size: 14px;
    }
    
    .feature-icon {
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .right-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      background: white;
    }
    
    .login-form-container {
      width: 100%;
      max-width: 400px;
    }
    
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .login-title {
      font-size: 28px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
    }
    
    .login-subtitle {
      font-size: 14px;
      color: #64748b;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 8px;
    }
    
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-size: 15px;
      transition: all 0.2s;
      background: #f8fafc;
    }
    
    .form-input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      background: white;
    }
    
    .form-input::placeholder {
      color: #94a3b8;
    }
    
    .password-wrapper {
      position: relative;
    }
    
    .password-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #94a3b8;
      padding: 4px;
    }
    
    .password-toggle:hover {
      color: #64748b;
    }
    
    .remember-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    
    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #64748b;
    }
    
    .remember-me input {
      width: 16px;
      height: 16px;
      accent-color: #3b82f6;
    }
    
    .forgot-link {
      font-size: 14px;
      color: #3b82f6;
      text-decoration: none;
    }
    
    .forgot-link:hover {
      text-decoration: underline;
    }
    
    .error-message {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 20px;
    }
    
    .login-btn {
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }
    
    .login-btn:active {
      transform: translateY(0);
    }
    
    .footer-text {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #64748b;
    }
    
    .footer-text a {
      color: #3b82f6;
      text-decoration: none;
    }
    
    .footer-text a:hover {
      text-decoration: underline;
    }
    
    @media (max-width: 1024px) {
      .container {
        grid-template-columns: 1fr;
      }
      
      .left-panel {
        display: none;
      }
      
      .right-panel {
        min-height: 100vh;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <div class="logo">
        <div class="logo-icon">E</div>
        <span>大亮ERP</span>
      </div>
      
      <div class="brand-content">
        <h1 class="brand-title">智能企业管理</h1>
        <p class="brand-subtitle">集成物料、BOM、库存、采购、销售于一体的现代化管理系统</p>
      </div>
      
      <div class="features">
        <div class="feature-item">
          <div class="feature-icon">📦</div>
          <span>物料与BOM管理</span>
        </div>
        <div class="feature-item">
          <div class="feature-icon">📊</div>
          <span>实时库存追踪</span>
        </div>
        <div class="feature-item">
          <div class="feature-icon">🛒</div>
          <span>采购销售一体化</span>
        </div>
      </div>
    </div>
    
    <div class="right-panel">
      <div class="login-form-container">
        <div class="login-header">
          <h1 class="login-title">欢迎回来</h1>
          <p class="login-subtitle">请登录您的账户</p>
        </div>
        
        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}
        
        <form method="post" action="/auth/login">
          <div class="form-group">
            <label class="form-label" for="username">用户名</label>
            <input 
              type="text" 
              id="username" 
              name="username" 
              class="form-input" 
              placeholder="请输入用户名"
              required
              autofocus
            >
          </div>
          
          <div class="form-group">
            <label class="form-label" for="password">密码</label>
            <div class="password-wrapper">
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="form-input" 
                placeholder="请输入密码"
                required
                style="padding-right: 48px;"
              >
              <button type="button" class="password-toggle" onclick="togglePassword()">
                👁
              </button>
            </div>
          </div>
          
          <div class="remember-row">
            <label class="remember-me">
              <input type="checkbox" name="remember">
              记住我
            </label>
          </div>
          
          <button type="submit" class="login-btn">登录</button>
        </form>
        
        <p class="footer-text">
          <a href="/">返回首页</a>
        </p>
      </div>
    </div>
  </div>
  
  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.querySelector('.password-toggle');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleBtn.textContent = '🙈';
      } else {
        passwordInput.type = 'password';
        toggleBtn.textContent = '👁';
      }
    }
  </script>
</body>
</html>
